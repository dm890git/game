
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⚡ Bounce Ball • Challenging Levels</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      user-select: none;
    }

    body {
      background: linear-gradient(145deg, #0d1a26 0%, #1a2f3f 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .game-wrapper {
      background: rgba(20, 40, 55, 0.85);
      backdrop-filter: blur(8px);
      border-radius: 48px;
      padding: 24px 28px 32px;
      box-shadow: 0 40px 80px rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(100, 200, 220, 0.08);
      max-width: 820px;
      width: 100%;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }

    header h1 {
      color: #b0eee0;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header h1 span {
      background: #2a5060;
      padding: 4px 16px;
      border-radius: 40px;
      font-size: 0.75rem;
      font-weight: 500;
      color: #b0d8d8;
    }

    .stats {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .stat-badge {
      background: #1a3340;
      padding: 6px 18px;
      border-radius: 40px;
      color: #d0ecec;
      font-weight: 600;
      font-size: 0.95rem;
      border: 1px solid #3a6a7a;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-badge .value {
      color: #f0fff0;
      font-size: 1.3rem;
      min-width: 24px;
      text-align: center;
    }

    .canvas-container {
      position: relative;
      background: #0a1a22;
      border-radius: 32px;
      overflow: hidden;
      box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.8);
      border: 2px solid #2a5060;
      margin: 6px 0 14px;
      width: 100%;
      aspect-ratio: 4 / 3;
      max-width: 780px;
      margin-left: auto;
      margin-right: auto;
      touch-action: none;
    }

    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #0a1a22;
      image-rendering: auto;
      cursor: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 32px;
      color: white;
      opacity: 0;
      pointer-events: none;
      transition: 0.3s;
    }

    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .overlay h2 {
      font-size: 3rem;
      margin-bottom: 8px;
      color: #f0faf0;
    }

    .overlay p {
      font-size: 1.3rem;
      color: #b0d8d8;
      margin: 4px 0;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin: 12px 0 8px;
    }

    .btn {
      border: none;
      background: #2a5060;
      color: #e0f0f0;
      padding: 12px 30px;
      border-radius: 60px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.15s;
      border: 1px solid #3a7a8a;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn:hover {
      background: #3a7a8a;
      transform: scale(0.97);
    }

    .btn.primary {
      background: #3a8a4a;
      border-color: #4aaa5a;
    }

    .btn.primary:hover {
      background: #4aaa5a;
    }

    .btn.danger {
      background: #8a3a3a;
      border-color: #aa4a4a;
    }

    .btn.danger:hover {
      background: #aa4a4a;
    }

    .level-indicator {
      text-align: center;
      color: #8ab0b0;
      font-weight: 600;
      font-size: 1.1rem;
      margin-bottom: 4px;
      letter-spacing: 1px;
    }

    .level-indicator strong {
      color: #d0f0f0;
      font-size: 1.3rem;
    }

    @media (max-width: 550px) {
      .game-wrapper { padding: 14px 10px; }
      header h1 { font-size: 1.5rem; }
      .stat-badge { font-size: 0.75rem; padding: 4px 12px; }
      .stat-badge .value { font-size: 1rem; }
      .overlay h2 { font-size: 2rem; }
      .overlay p { font-size: 1rem; }
      .btn { padding: 10px 20px; font-size: 0.85rem; }
    }
  </style>
</head>
<body>

<div class="game-wrapper">
  <header>
    <h1>
      🏀 Bounce
      <span>levels</span>
    </h1>
    <div class="stats">
      <span class="stat-badge">⭐ <span class="value" id="scoreDisplay">0</span></span>
      <span class="stat-badge">❤️ <span class="value" id="livesDisplay">3</span></span>
      <span class="stat-badge">🏆 <span class="value" id="bestDisplay">0</span></span>
    </div>
  </header>

  <div class="level-indicator">
    Level <strong id="levelDisplay">1</strong> &nbsp;·&nbsp; <span id="levelGoal">Clear 5 bricks</span>
  </div>

  <div class="canvas-container" id="canvasContainer">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">🏀 Ready?</h2>
      <p id="overlayDesc">Press Play or tap to start</p>
    </div>
  </div>

  <div class="controls">
    <button class="btn primary" id="playBtn" onclick="togglePlay()">▶ Play</button>
    <button class="btn danger" onclick="resetGame()">⟳ Reset</button>
  </div>
</div>

<script>
  // --------------------------------------------------------------
  //  BOUNCE BALL  —  Challenging levels with bricks, speed, and twists
  // --------------------------------------------------------------
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const container = document.getElementById('canvasContainer');

  // UI
  const scoreDisplay = document.getElementById('scoreDisplay');
  const livesDisplay = document.getElementById('livesDisplay');
  const bestDisplay = document.getElementById('bestDisplay');
  const levelDisplay = document.getElementById('levelDisplay');
  const levelGoal = document.getElementById('levelGoal');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayDesc = document.getElementById('overlayDesc');
  const playBtn = document.getElementById('playBtn');

  // Canvas dimensions
  const W = 800, H = 600;

  // Game state
  let ball = { x: 400, y: 500, r: 12, dx: 0, dy: 0, speed: 5 };
  let paddle = { x: 350, y: 570, w: 120, h: 16 };
  let bricks = [];
  let score = 0;
  let lives = 3;
  let level = 1;
  let gameRunning = false;
  let gameOver = false;
  let paused = false;
  let animFrame = null;
  let bestScore = parseInt(localStorage.getItem('bounceBest')) || 0;
  bestDisplay.textContent = bestScore;

  // Mouse / touch tracking
  let pointerX = paddle.x + paddle.w/2;
  let isPointerDown = false;

  // --------------------------------------------------------------
  //  LEVEL CONFIGURATIONS
  // --------------------------------------------------------------
  function getLevelConfig(lvl) {
    const configs = [
      { rows: 3, cols: 5, speed: 4.5, brickHealth: 1, brickColors: ['#ff6b6b', '#ffa94d', '#ffd93d'] },
      { rows: 4, cols: 6, speed: 5.2, brickHealth: 1, brickColors: ['#ff6b6b', '#ffa94d', '#ffd93d', '#6bcb6b'] },
      { rows: 5, cols: 7, speed: 6.0, brickHealth: 1, brickColors: ['#ff6b6b', '#ffa94d', '#ffd93d', '#6bcb6b', '#6bb5ff'] },
      { rows: 5, cols: 8, speed: 6.8, brickHealth: 2, brickColors: ['#ff6b6b', '#ffa94d', '#ffd93d', '#6bcb6b', '#6bb5ff', '#b56bff'] },
      { rows: 6, cols: 8, speed: 7.5, brickHealth: 2, brickColors: ['#ff6b6b', '#ffa94d', '#ffd93d', '#6bcb6b', '#6bb5ff', '#b56bff', '#ff6b9d'] },
      { rows: 6, cols: 9, speed: 8.5, brickHealth: 2, brickColors: ['#ff6b6b', '#ffa94d', '#ffd93d', '#6bcb6b', '#6bb5ff', '#b56bff', '#ff6b9d', '#6bd4d4'] },
      { rows: 7, cols: 9, speed: 9.0, brickHealth: 3, brickColors: ['#ff6b6b', '#ffa94d', '#ffd93d', '#6bcb6b', '#6bb5ff', '#b56bff', '#ff6b9d', '#6bd4d4', '#ffb56b'] },
      { rows: 7, cols: 10, speed: 10.0, brickHealth: 3, brickColors: ['#ff6b6b', '#ffa94d', '#ffd93d', '#6bcb6b', '#6bb5ff', '#b56bff', '#ff6b9d', '#6bd4d4', '#ffb56b', '#b56b6b'] },
    ];
    const idx = Math.min(lvl - 1, configs.length - 1);
    return configs[idx];
  }

  // --------------------------------------------------------------
  //  BRICK GENERATION
  // --------------------------------------------------------------
  function generateBricks(lvl) {
    const cfg = getLevelConfig(lvl);
    const rows = cfg.rows;
    const cols = cfg.cols;
    const brickW = 70;
    const brickH = 24;
    const gap = 6;
    const startX = (W - (cols * (brickW + gap) - gap)) / 2;
    const startY = 50;

    bricks = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const colorIdx = r % cfg.brickColors.length;
        bricks.push({
          x: startX + c * (brickW + gap),
          y: startY + r * (brickH + gap),
          w: brickW,
          h: brickH,
          health: cfg.brickHealth,
          maxHealth: cfg.brickHealth,
          color: cfg.brickColors[colorIdx],
          alive: true
        });
      }
    }
    return cfg;
  }

  // --------------------------------------------------------------
  //  INIT LEVEL
  // --------------------------------------------------------------
  let currentCfg = null;
  let bricksRemaining = 0;

  function initLevel(lvl) {
    currentCfg = generateBricks(lvl);
    bricksRemaining = bricks.filter(b => b.alive).length;
    levelGoal.textContent = `Clear ${bricksRemaining} bricks`;

    // Reset ball & paddle
    ball.x = 400;
    ball.y = 500;
    paddle.x = 350;
    paddle.y = 570;
    paddle.w = Math.max(80, 120 - (lvl - 1) * 3); // paddle shrinks slightly with levels
    const angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.8;
    const spd = currentCfg ? currentCfg.speed : 5;
    ball.dx = Math.cos(angle) * spd;
    ball.dy = Math.sin(angle) * spd;
    ball.speed = spd;

    // Ensure ball moves downward initially
    if (ball.dy > -1) ball.dy = -spd * 0.9;

    pointerX = paddle.x + paddle.w/2;
    updateUI();
  }

  // --------------------------------------------------------------
  //  RESET GAME
  // --------------------------------------------------------------
  function resetGame() {
    gameRunning = false;
    gameOver = false;
    paused = false;
    if (animFrame) cancelAnimationFrame(animFrame);
    animFrame = null;
    playBtn.textContent = '▶ Play';
    overlay.classList.remove('show');
    score = 0;
    lives = 3;
    level = 1;
    initLevel(level);
    updateUI();
    draw();
  }

  // --------------------------------------------------------------
  //  PLAY / PAUSE
  // --------------------------------------------------------------
  function togglePlay() {
    if (gameOver) {
      resetGame();
      return;
    }
    if (gameRunning) {
      paused = !paused;
      playBtn.textContent = paused ? '▶ Play' : '⏸ Pause';
      if (paused) {
        showOverlay('⏸️ Paused', 'Press Play to resume');
      } else {
        overlay.classList.remove('show');
        if (!animFrame) gameLoop();
      }
    } else {
      gameRunning = true;
      paused = false;
      playBtn.textContent = '⏸ Pause';
      overlay.classList.remove('show');
      if (!animFrame) gameLoop();
    }
  }

  function showOverlay(title, desc) {
    overlayTitle.textContent = title;
    overlayDesc.textContent = desc;
    overlay.classList.add('show');
  }

  // --------------------------------------------------------------
  //  GAME LOOP
  // --------------------------------------------------------------
  function gameLoop() {
    if (!gameRunning || paused || gameOver) {
      animFrame = null;
      return;
    }
    update();
    draw();
    animFrame = requestAnimationFrame(gameLoop);
  }

  // --------------------------------------------------------------
  //  UPDATE
  // --------------------------------------------------------------
  function update() {
    // Move ball
    ball.x += ball.dx;
    ball.y += ball.dy;

    // Wall collisions
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.dx = -ball.dx; }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.dx = -ball.dx; }
    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.dy = -ball.dy; }

    // Bottom → lose life
    if (ball.y + ball.r > H) {
      lives--;
      updateUI();
      if (lives <= 0) {
        gameOver = true;
        gameRunning = false;
        playBtn.textContent = '▶ Play';
        if (score > bestScore) {
          bestScore = score;
          localStorage.setItem('bounceBest', bestScore);
          bestDisplay.textContent = bestScore;
        }
        showOverlay('💀 Game Over', `Score: ${score}  •  Level: ${level}`);
        draw();
        return;
      }
      // Reset ball
      ball.x = 400;
      ball.y = 480;
      const spd = currentCfg ? currentCfg.speed : 5;
      const angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.8;
      ball.dx = Math.cos(angle) * spd;
      ball.dy = Math.sin(angle) * spd;
      if (ball.dy > -1) ball.dy = -spd * 0.9;
      paddle.x = Math.max(0, Math.min(W - paddle.w, pointerX - paddle.w/2));
      draw();
      return;
    }

    // Paddle collision (with smooth angle based on hit position)
    const px = paddle.x, py = paddle.y, pw = paddle.w, ph = paddle.h;
    if (ball.dy > 0 &&
        ball.x + ball.r > px && ball.x - ball.r < px + pw &&
        ball.y + ball.r > py && ball.y + ball.r < py + ph + 10) {
      // Calculate hit position (0 to 1)
      const hitPos = (ball.x - px) / pw;
      const angle = (hitPos - 0.5) * 1.2; // -0.6 to 0.6 rad
      const spd = currentCfg ? currentCfg.speed : 5;
      ball.dx = Math.sin(angle) * spd;
      ball.dy = -Math.cos(angle) * spd;
      // Ensure minimum vertical speed
      if (Math.abs(ball.dy) < spd * 0.4) ball.dy = -spd * 0.5;
      ball.y = py - ball.r;
    }

    // Brick collisions
    for (const brick of bricks) {
      if (!brick.alive) continue;
      const bx = brick.x, by = brick.y, bw = brick.w, bh = brick.h;
      // AABB collision
      if (ball.x + ball.r > bx && ball.x - ball.r < bx + bw &&
          ball.y + ball.r > by && ball.y - ball.r < by + bh) {
        // Determine collision side
        const overlapX = Math.min(ball.x + ball.r - bx, bx + bw - (ball.x - ball.r));
        const overlapY = Math.min(ball.y + ball.r - by, by + bh - (ball.y - ball.r));
        if (overlapX < overlapY) {
          ball.dx = -ball.dx;
        } else {
          ball.dy = -ball.dy;
        }
        // Reduce health
        brick.health--;
        if (brick.health <= 0) {
          brick.alive = false;
          score += 10 + (level - 1) * 2;
          bricksRemaining--;
          updateUI();
          // Level complete?
          if (bricksRemaining <= 0) {
            level++;
            // Extra life every 3 levels
            if (level % 3 === 0) lives++;
            initLevel(level);
            updateUI();
            showOverlay(`🎉 Level ${level-1} Complete!`, `Starting Level ${level}`);
            setTimeout(() => {
              if (gameRunning && !paused) overlay.classList.remove('show');
            }, 800);
            draw();
            return;
          }
        }
        break;
      }
    }

    // paddle follow pointer (smooth)
    const targetX = pointerX - paddle.w / 2;
    paddle.x += (Math.max(0, Math.min(W - paddle.w, targetX)) - paddle.x) * 0.3;
    if (Math.abs(paddle.x - targetX) < 0.5) paddle.x = Math.max(0, Math.min(W - paddle.w, targetX));

    levelGoal.textContent = `Clear ${bricksRemaining} bricks`;
  }

  // --------------------------------------------------------------
  //  DRAW  —  beautiful, polished
  // --------------------------------------------------------------
  function draw() {
    ctx.clearRect(0, 0, W, H);

    // background gradient
    const grad = ctx.createRadialGradient(400, 300, 100, 400, 300, 500);
    grad.addColorStop(0, '#0f2835');
    grad.addColorStop(1, '#061015');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // draw bricks
    for (const brick of bricks) {
      if (!brick.alive) continue;
      const healthRatio = brick.health / brick.maxHealth;
      const alpha = 0.6 + 0.4 * healthRatio;
      ctx.shadowColor = brick.color;
      ctx.shadowBlur = 12;
      ctx.fillStyle = brick.color;
      ctx.globalAlpha = alpha;
      const r = 4;
      const x = brick.x, y = brick.y, w = brick.w, h = brick.h;
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
      ctx.fill();
      // health indicator
      if (brick.maxHealth > 1) {
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.fillRect(x + 6, y + h - 6, (w - 12) * (brick.health / brick.maxHealth), 4);
        ctx.fillStyle = 'rgba(255,255,255,0.1)';
        ctx.fillRect(x + 6, y + h - 6, w - 12, 4);
      }
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;

    // paddle
    ctx.shadowColor = '#88ddff';
    ctx.shadowBlur = 20;
    ctx.fillStyle = '#6bc8e8';
    const px = paddle.x, py = paddle.y, pw = paddle.w, ph = paddle.h;
    const r2 = 10;
    ctx.beginPath();
    ctx.moveTo(px + r2, py);
    ctx.arcTo(px + pw, py, px + pw, py + ph, r2);
    ctx.arcTo(px + pw, py + ph, px, py + ph, r2);
    ctx.arcTo(px, py + ph, px, py, r2);
    ctx.arcTo(px, py, px + pw, py, r2);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;

    // paddle glow line
    ctx.strokeStyle = 'rgba(200, 240, 255, 0.3)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(px + 10, py + 2);
    ctx.lineTo(px + pw - 10, py + 2);
    ctx.stroke();

    // ball with glow
    ctx.shadowColor = '#ffcc66';
    ctx.shadowBlur = 30;
    const grad2 = ctx.createRadialGradient(
      ball.x - 4, ball.y - 4, 2,
      ball.x, ball.y, ball.r
    );
    grad2.addColorStop(0, '#ffeeaa');
    grad2.addColorStop(0.5, '#ffaa44');
    grad2.addColorStop(1, '#dd7722');
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = grad2;
    ctx.fill();
    ctx.shadowBlur = 0;

    // ball highlight
    ctx.beginPath();
    ctx.arc(ball.x - 4, ball.y - 5, 4, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fill();
  }

  // --------------------------------------------------------------
  //  UI UPDATE
  // --------------------------------------------------------------
  function updateUI() {
    scoreDisplay.textContent = score;
    livesDisplay.textContent = lives;
    levelDisplay.textContent = level;
    if (score > bestScore) {
      bestScore = score;
      localStorage.setItem('bounceBest', bestScore);
      bestDisplay.textContent = bestScore;
    }
    bestDisplay.textContent = bestScore;
  }

  // --------------------------------------------------------------
  //  POINTER EVENTS  (mouse + touch)
  // --------------------------------------------------------------
  function handlePointer(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    let clientX, clientY;
    if (e.touches) {
      clientX = e.touches[0].clientX;
      clientY = e.touches[0].clientY;
      e.preventDefault();
    } else {
      clientX = e.clientX;
      clientY = e.clientY;
    }
    const canvasX = (clientX - rect.left) * scaleX;
    const canvasY = (clientY - rect.top) * scaleY;
    pointerX = Math.max(0, Math.min(W, canvasX));

    // If game not started, tap to start
    if (!gameRunning && !gameOver) {
      togglePlay();
    }
  }

  // Mouse
  canvas.addEventListener('mousemove', handlePointer);
  canvas.addEventListener('mousedown', (e) => {
    if (!gameRunning && !gameOver) togglePlay();
    handlePointer(e);
  });

  // Touch
  canvas.addEventListener('touchmove', handlePointer, { passive: false });
  canvas.addEventListener('touchstart', (e) => {
    if (!gameRunning && !gameOver) togglePlay();
    handlePointer(e);
  }, { passive: false });

  // Keyboard
  document.addEventListener('keydown', (e) => {
    if (e.key === ' ' || e.key === 'Space') {
      e.preventDefault();
      togglePlay();
    }
    if (e.key === 'r' || e.key === 'R') resetGame();
    // Arrow keys for paddle control
    const step = 25;
    if (e.key === 'ArrowLeft') {
      pointerX = Math.max(0, pointerX - step);
      e.preventDefault();
    }
    if (e.key === 'ArrowRight') {
      pointerX = Math.min(W, pointerX + step);
      e.preventDefault();
    }
  });

  // --------------------------------------------------------------
  //  START
  // --------------------------------------------------------------
  initLevel(1);
  draw();
  showOverlay('🏀 Ready?', 'Press Play or tap to start');
</script>

</body>
</html>
```
